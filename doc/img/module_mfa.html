<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>★MFA: Multi-scale Frequency Awareness</title>
<style>
body { margin: 0; display: flex; justify-content: center; align-items: flex-start; background: #fff; font-family: Arial, Helvetica, sans-serif; padding: 20px; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-sm" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#FF5722">★ MFA: Multi-scale Frequency Awareness</text>
  <text x="500" y="44" text-anchor="middle" font-size="11" fill="#555">多尺度频域感知增强</text>

  <!-- Outer innovation border -->
  <rect x="20" y="52" width="960" height="585" rx="12" ry="12" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- ===== Upper: Haar DWT Pyramid ===== -->
  <text x="500" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Haar DWT 三级小波分解金字塔</text>

  <!-- Input feature -->
  <rect x="400" y="82" width="200" height="26" rx="5" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.2"/>
  <text x="500" y="100" text-anchor="middle" font-size="10" font-weight="bold">输入特征图 [C, H, W]</text>

  <!-- Arrow to Level 1 -->
  <line x1="500" y1="108" x2="500" y2="118" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Level 1 - largest -->
  <text x="200" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">DWT Level 1</text>
  <text x="200" y="142" text-anchor="middle" font-size="9" fill="#666">H/2 × W/2 × 4C</text>
  <!-- 2x2 grid for Level 1 -->
  <rect x="120" y="148" width="72" height="36" rx="4" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.2"/>
  <text x="156" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D47A1">LL₁</text>
  <rect x="196" y="148" width="72" height="36" rx="4" fill="#FFCCBC" stroke="#E64A19" stroke-width="1.2"/>
  <text x="232" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF360C">LH₁</text>
  <rect x="120" y="188" width="72" height="36" rx="4" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.2"/>
  <text x="156" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">HL₁</text>
  <rect x="196" y="188" width="72" height="36" rx="4" fill="#FFAB91" stroke="#D84315" stroke-width="1.2"/>
  <text x="232" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF360C">HH₁</text>

  <!-- Level 2 - medium -->
  <text x="500" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">DWT Level 2 (on LL₁)</text>
  <text x="500" y="142" text-anchor="middle" font-size="9" fill="#666">H/4 × W/4 × 4C</text>
  <rect x="435" y="148" width="58" height="30" rx="4" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.2"/>
  <text x="464" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D47A1">LL₂</text>
  <rect x="497" y="148" width="58" height="30" rx="4" fill="#FFCCBC" stroke="#E64A19" stroke-width="1.2"/>
  <text x="526" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">LH₂</text>
  <rect x="435" y="182" width="58" height="30" rx="4" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.2"/>
  <text x="464" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">HL₂</text>
  <rect x="497" y="182" width="58" height="30" rx="4" fill="#FFAB91" stroke="#D84315" stroke-width="1.2"/>
  <text x="526" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">HH₂</text>

  <!-- Level 3 - smallest -->
  <text x="780" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">DWT Level 3 (on LL₂)</text>
  <text x="780" y="142" text-anchor="middle" font-size="9" fill="#666">H/8 × W/8 × 4C</text>
  <rect x="730" y="148" width="44" height="24" rx="3" fill="#BBDEFB" stroke="#1976D2" stroke-width="1.2"/>
  <text x="752" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#0D47A1">LL₃</text>
  <rect x="778" y="148" width="44" height="24" rx="3" fill="#FFCCBC" stroke="#E64A19" stroke-width="1.2"/>
  <text x="800" y="165" text-anchor="middle" font-size="9" font-weight="bold" fill="#BF360C">LH₃</text>
  <rect x="730" y="176" width="44" height="24" rx="3" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.2"/>
  <text x="752" y="193" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">HL₃</text>
  <rect x="778" y="176" width="44" height="24" rx="3" fill="#FFAB91" stroke="#D84315" stroke-width="1.2"/>
  <text x="800" y="193" text-anchor="middle" font-size="9" font-weight="bold" fill="#BF360C">HH₃</text>

  <!-- Arrows between levels -->
  <line x1="270" y1="175" x2="430" y2="175" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <text x="350" y="170" text-anchor="middle" font-size="8" fill="#555">on LL₁</text>
  <line x1="560" y1="175" x2="725" y2="175" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <text x="640" y="170" text-anchor="middle" font-size="8" fill="#555">on LL₂</text>

  <!-- Processing pipeline below pyramid -->
  <text x="500" y="238" text-anchor="middle" font-size="10" fill="#333">各层输出 →</text>

  <!-- 1x1 Conv boxes -->
  <rect x="150" y="245" width="110" height="22" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="205" y="260" text-anchor="middle" font-size="9">1×1 Conv (4C→C)</text>

  <rect x="380" y="245" width="110" height="22" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="435" y="260" text-anchor="middle" font-size="9">1×1 Conv (4C→C)</text>

  <rect x="650" y="245" width="110" height="22" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="705" y="260" text-anchor="middle" font-size="9">1×1 Conv (4C→C)</text>

  <!-- Upsample + Concat -->
  <rect x="300" y="275" width="400" height="22" rx="4" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <text x="500" y="290" text-anchor="middle" font-size="9" font-weight="bold">Upsample to H×W → Concat → f_freq [3C, H, W]</text>

  <!-- Arrow down -->
  <line x1="500" y1="297" x2="500" y2="310" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Divider -->
  <line x1="40" y1="315" x2="960" y2="315" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== Lower: CascadedFSG ===== -->
  <text x="500" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">CascadedFSG 三级级联融合门</text>

  <!-- f_spatial input -->
  <rect x="50" y="355" width="180" height="30" rx="6" fill="#C8E6C9" stroke="#43A047" stroke-width="1.2"/>
  <text x="140" y="375" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B5E20">f_spatial (空间特征)</text>

  <!-- f_freq input -->
  <rect x="50" y="405" width="180" height="30" rx="6" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.2"/>
  <text x="140" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">f_freq (频域特征)</text>

  <!-- Arrow from f_spatial to right -->
  <line x1="230" y1="370" x2="870" y2="370" stroke="#2E7D32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="550" y="363" text-anchor="middle" font-size="8" fill="#2E7D32">residual skip connection</text>

  <!-- Stage 1 -->
  <rect x="280" y="400" width="140" height="40" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="350" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">AmpDis</text>
  <text x="350" y="433" text-anchor="middle" font-size="9" fill="#E65100">7×7 kernel</text>

  <!-- gate 1 circle -->
  <circle cx="460" cy="420" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="425" text-anchor="middle" font-size="12" font-weight="bold">⊗</text>
  <text x="460" y="446" text-anchor="middle" font-size="8" fill="#555">gate₁</text>

  <!-- Arrow f_freq to stage 1 -->
  <line x1="230" y1="420" x2="278" y2="420" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <!-- Arrow stage 1 to gate -->
  <line x1="420" y1="420" x2="444" y2="420" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- out1 -->
  <rect x="490" y="410" width="50" height="20" rx="4" fill="#FFECB3" stroke="#FF8F00" stroke-width="1"/>
  <text x="515" y="424" text-anchor="middle" font-size="8" font-weight="bold">out1</text>
  <line x1="474" y1="420" x2="488" y2="420" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Stage 2 -->
  <rect x="280" y="460" width="160" height="44" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="360" y="480" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">AmpDis</text>
  <text x="360" y="496" text-anchor="middle" font-size="9" fill="#E65100">9×9 kernel</text>

  <!-- gate 2 circle -->
  <circle cx="490" cy="482" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="487" text-anchor="middle" font-size="12" font-weight="bold">⊗</text>
  <text x="490" y="508" text-anchor="middle" font-size="8" fill="#555">gate₂</text>

  <!-- Arrow cascade out1 to stage2 -->
  <line x1="515" y1="430" x2="515" y2="455" stroke="#E65100" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <line x1="515" y1="455" x2="442" y2="460" stroke="#E65100" stroke-width="1" marker-end="url(#arrow-sm)"/>

  <!-- Arrow f_freq to stage 2 -->
  <line x1="140" y1="435" x2="140" y2="482" stroke="#333" stroke-width="1"/>
  <line x1="140" y1="482" x2="278" y2="482" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Arrow stage 2 to gate2 -->
  <line x1="440" y1="482" x2="474" y2="482" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- out2 -->
  <rect x="520" y="472" width="50" height="20" rx="4" fill="#FFECB3" stroke="#FF8F00" stroke-width="1"/>
  <text x="545" y="486" text-anchor="middle" font-size="8" font-weight="bold">out2</text>
  <line x1="504" y1="482" x2="518" y2="482" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Stage 3 -->
  <rect x="280" y="525" width="180" height="48" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="370" y="547" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">AmpDis</text>
  <text x="370" y="563" text-anchor="middle" font-size="9" fill="#E65100">11×11 kernel</text>

  <!-- gate 3 circle -->
  <circle cx="520" cy="549" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="554" text-anchor="middle" font-size="12" font-weight="bold">⊗</text>
  <text x="520" y="575" text-anchor="middle" font-size="8" fill="#555">gate₃</text>

  <!-- Arrow cascade out2 to stage3 -->
  <line x1="545" y1="492" x2="545" y2="520" stroke="#E65100" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <line x1="545" y1="520" x2="462" y2="525" stroke="#E65100" stroke-width="1" marker-end="url(#arrow-sm)"/>

  <!-- Arrow f_freq to stage 3 -->
  <line x1="140" y1="482" x2="140" y2="549" stroke="#333" stroke-width="1"/>
  <line x1="140" y1="549" x2="278" y2="549" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Arrow stage 3 to gate3 -->
  <line x1="460" y1="549" x2="504" y2="549" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- out3 -->
  <rect x="550" y="539" width="50" height="20" rx="4" fill="#FFECB3" stroke="#FF8F00" stroke-width="1"/>
  <text x="575" y="553" text-anchor="middle" font-size="8" font-weight="bold">out3</text>
  <line x1="534" y1="549" x2="548" y2="549" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Addition operator -->
  <circle cx="680" cy="549" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="680" y="554" text-anchor="middle" font-size="14" font-weight="bold">⊕</text>

  <!-- Arrow out3 to addition -->
  <line x1="600" y1="549" x2="664" y2="549" stroke="#333" stroke-width="1.2" marker-end="url(#arrow-sm)"/>
  <!-- scale label -->
  <text x="632" y="542" text-anchor="middle" font-size="9" fill="#E65100" font-weight="bold">× scale</text>

  <!-- Arrow f_spatial skip to addition -->
  <line x1="870" y1="370" x2="870" y2="549" stroke="#2E7D32" stroke-width="1.2"/>
  <line x1="870" y1="549" x2="696" y2="549" stroke="#2E7D32" stroke-width="1.2" marker-end="url(#arrow-sm)"/>

  <!-- Output -->
  <rect x="730" y="535" width="180" height="28" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2"/>
  <text x="820" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B5E20">output [C, H, W]</text>
  <!-- Arrow from addition to output - but addition is at 680, output starts at 730 -->
  <!-- Adjust: output is to the right of ⊕ -->

  <!-- Reroute: ⊕ at 680 outputs right to output box -->
  <!-- Actually let me put output below ⊕ -->

  <!-- Final formula -->
  <rect x="250" y="600" width="500" height="28" rx="6" fill="#FBE9E7" stroke="#FF5722" stroke-width="1.2"/>
  <text x="500" y="619" text-anchor="middle" font-size="11" font-weight="bold" fill="#BF360C">output = x + s · CascadedFSG( DWT(x), x )</text>

  <!-- Color legend -->
  <rect x="750" y="345" width="12" height="12" rx="2" fill="#BBDEFB" stroke="#1976D2" stroke-width="0.8"/>
  <text x="768" y="355" font-size="9" fill="#333">LL (低频)</text>
  <rect x="830" y="345" width="12" height="12" rx="2" fill="#FFAB91" stroke="#D84315" stroke-width="0.8"/>
  <text x="848" y="355" font-size="9" fill="#333">LH/HL/HH (高频)</text>

</svg>
</body>
</html>
