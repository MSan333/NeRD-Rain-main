<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>★MFGCP 频域-梯度协同感知模块 (Multi-Frequency Gradient Co-Perception)</title>
<style>
body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <!-- Background -->
  <rect width="900" height="650" fill="#ffffff" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">★MFGCP — Multi-Frequency Gradient Co-Perception</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#666">频域-梯度协同感知模块</text>

  <!-- Innovation dashed border -->
  <rect x="30" y="55" width="550" height="530" rx="12" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="50" y="72" font-size="11" fill="#FF5722" font-weight="bold">★ Innovation Module</text>

  <!-- Input -->
  <rect x="230" y="78" width="150" height="32" rx="6" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="305" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">输入特征 x</text>

  <!-- Arrow to LayerNorm -->
  <line x1="305" y1="110" x2="305" y2="126" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- LayerNorm -->
  <rect x="225" y="126" width="160" height="30" rx="6" fill="#F5F5F5" stroke="#757575" stroke-width="1.5"/>
  <text x="305" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">LayerNorm</text>

  <!-- Split into 3 branches -->
  <line x1="305" y1="156" x2="305" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="305" y1="170" x2="120" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="305" y1="170" x2="490" y2="170" stroke="#333" stroke-width="1.5"/>
  <line x1="120" y1="170" x2="120" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="305" y1="170" x2="305" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="490" y1="170" x2="490" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Branch 1: FFN (Left) -->
  <rect x="55" y="192" width="130" height="130" rx="8" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="120" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57F17">FFN</text>
  <text x="120" y="226" text-anchor="middle" font-size="9" fill="#666">前馈网络</text>
  <!-- FFN internal -->
  <rect x="75" y="236" width="90" height="20" rx="3" fill="#fff" stroke="#F9A825" stroke-width="1"/>
  <text x="120" y="250" text-anchor="middle" font-size="9" fill="#333">Linear</text>
  <rect x="75" y="260" width="90" height="20" rx="3" fill="#FFF59D" stroke="#F9A825" stroke-width="1"/>
  <text x="120" y="274" text-anchor="middle" font-size="9" fill="#333">GELU</text>
  <rect x="75" y="284" width="90" height="20" rx="3" fill="#fff" stroke="#F9A825" stroke-width="1"/>
  <text x="120" y="298" text-anchor="middle" font-size="9" fill="#333">Linear</text>

  <!-- Branch 2: RFM (Center) -->
  <rect x="230" y="192" width="150" height="130" rx="8" fill="#FFE0B2" stroke="#FF8F00" stroke-width="1.5"/>
  <text x="305" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">★ RFM</text>
  <text x="305" y="226" text-anchor="middle" font-size="9" fill="#666">残差频域模块</text>
  <!-- RFM internal -->
  <rect x="252" y="236" width="106" height="20" rx="3" fill="#fff" stroke="#FF8F00" stroke-width="1"/>
  <text x="305" y="250" text-anchor="middle" font-size="9" fill="#333">2D-FFT</text>
  <rect x="252" y="260" width="106" height="20" rx="3" fill="#FFCC80" stroke="#FF8F00" stroke-width="1"/>
  <text x="305" y="274" text-anchor="middle" font-size="9" fill="#333">Amplitude Enhance</text>
  <rect x="252" y="284" width="106" height="20" rx="3" fill="#fff" stroke="#FF8F00" stroke-width="1"/>
  <text x="305" y="298" text-anchor="middle" font-size="9" fill="#333">2D-iFFT</text>

  <!-- Branch 3: MDPConv (Right) -->
  <rect x="415" y="192" width="150" height="130" rx="8" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="490" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">MDPConv</text>
  <text x="490" y="226" text-anchor="middle" font-size="9" fill="#666">五方向微分卷积</text>
  <!-- MDPConv internal simplified -->
  <rect x="430" y="236" width="120" height="16" rx="3" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.8"/>
  <text x="490" y="248" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">HDC (1×3)</text>
  <rect x="430" y="254" width="120" height="16" rx="3" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.8"/>
  <text x="490" y="266" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">VC (3×1)</text>
  <rect x="430" y="272" width="120" height="16" rx="3" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.8"/>
  <text x="490" y="284" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">CDC (3×3)</text>
  <rect x="430" y="290" width="120" height="16" rx="3" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.8"/>
  <text x="490" y="302" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">ADC / VDC (3×3)</text>

  <!-- Alpha scaling for MDPConv -->
  <line x1="490" y1="322" x2="490" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="460" y="345" width="60" height="26" rx="6" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="490" y="362" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">× α</text>
  <text x="490" y="384" text-anchor="middle" font-size="8" fill="#9E9E9E">learnable scalar</text>

  <!-- Arrows from 3 branches down to merge -->
  <line x1="120" y1="322" x2="120" y2="410" stroke="#333" stroke-width="1.5"/>
  <line x1="305" y1="322" x2="305" y2="410" stroke="#333" stroke-width="1.5"/>
  <line x1="490" y1="371" x2="490" y2="410" stroke="#333" stroke-width="1.5"/>

  <!-- Merge horizontal line -->
  <line x1="120" y1="410" x2="490" y2="410" stroke="#333" stroke-width="1.5"/>
  <line x1="305" y1="410" x2="305" y2="425" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Add node ⊕ -->
  <circle cx="305" cy="440" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="305" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">⊕</text>

  <!-- Residual skip connection from input -->
  <path d="M 230 94 L 42 94 L 42 440 L 289 440" fill="none" stroke="#9E9E9E" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowG)"/>
  <text x="34" y="270" font-size="9" fill="#9E9E9E" transform="rotate(-90,38,270)">残差连接 (x)</text>

  <!-- Output -->
  <line x1="305" y1="456" x2="305" y2="478" stroke="#333" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="230" y="478" width="150" height="32" rx="6" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="305" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">输出特征</text>

  <!-- Formula -->
  <text x="305" y="530" text-anchor="middle" font-size="10" fill="#555" font-style="italic">y = x + FFN(LN(x)) + RFM(x) + α · MDPConv(x)</text>

  <!-- ==================== MDPConv Detail (Right side zoom) ==================== -->
  <rect x="600" y="70" width="280" height="500" rx="10" fill="#FAFAFA" stroke="#8E24AA" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="740" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">MDPConv 五方向微分详解</text>
  <text x="740" y="108" text-anchor="middle" font-size="9" fill="#999">Multi-Directional Partial Conv</text>

  <!-- HDC 1x3 -->
  <rect x="620" y="125" width="240" height="58" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="640" y="142" font-size="10" font-weight="bold" fill="#6A1B9A">HDC (1×3) 水平差分</text>
  <!-- Kernel visualization: 1x3 horizontal -->
  <rect x="640" y="150" width="24" height="24" rx="2" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1"/>
  <text x="652" y="166" text-anchor="middle" font-size="9" fill="#333">-1</text>
  <rect x="666" y="150" width="24" height="24" rx="2" fill="#CE93D8" stroke="#8E24AA" stroke-width="1"/>
  <text x="678" y="166" text-anchor="middle" font-size="9" fill="#fff">0</text>
  <rect x="692" y="150" width="24" height="24" rx="2" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1"/>
  <text x="704" y="166" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="740" y="166" font-size="9" fill="#666">→ 水平边缘</text>

  <!-- VC 3x1 -->
  <rect x="620" y="190" width="240" height="72" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="640" y="207" font-size="10" font-weight="bold" fill="#6A1B9A">VC (3×1) 垂直差分</text>
  <!-- Kernel visualization: 3x1 vertical -->
  <rect x="640" y="214" width="24" height="14" rx="2" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1"/>
  <text x="652" y="225" text-anchor="middle" font-size="8" fill="#333">-1</text>
  <rect x="640" y="230" width="24" height="14" rx="2" fill="#CE93D8" stroke="#8E24AA" stroke-width="1"/>
  <text x="652" y="241" text-anchor="middle" font-size="8" fill="#fff">0</text>
  <rect x="640" y="246" width="24" height="14" rx="2" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1"/>
  <text x="652" y="257" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="680" y="240" font-size="9" fill="#666">→ 垂直边缘</text>

  <!-- CDC 3x3 center -->
  <rect x="620" y="269" width="240" height="72" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="640" y="286" font-size="10" font-weight="bold" fill="#6A1B9A">CDC (3×3) 中心差分</text>
  <!-- 3x3 grid with center cross -->
  <g transform="translate(640,294)">
    <rect x="0" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="0" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="0" y="16" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="16" width="14" height="14" rx="1" fill="#7B1FA2" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="23" y="28" text-anchor="middle" font-size="7" fill="#fff">-4</text>
    <rect x="32" y="16" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="0" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="32" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
  </g>
  <text x="700" y="320" font-size="9" fill="#666">→ 中心+字形边缘</text>

  <!-- ADC 3x3 diagonal -->
  <rect x="620" y="348" width="240" height="72" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="640" y="365" font-size="10" font-weight="bold" fill="#6A1B9A">ADC (3×3) 对角线差分</text>
  <!-- 3x3 grid with diagonal -->
  <g transform="translate(640,373)">
    <rect x="0" y="0" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="7" y="10" text-anchor="middle" font-size="6" fill="#fff">1</text>
    <rect x="16" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="0" y="16" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="16" width="14" height="14" rx="1" fill="#7B1FA2" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="23" y="28" text-anchor="middle" font-size="6" fill="#fff">-2</text>
    <rect x="32" y="16" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="0" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="32" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="39" y="42" text-anchor="middle" font-size="6" fill="#fff">1</text>
  </g>
  <text x="700" y="400" font-size="9" fill="#666">→ 主对角线边缘 ╲</text>

  <!-- VDC 3x3 anti-diagonal -->
  <rect x="620" y="427" width="240" height="72" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="640" y="444" font-size="10" font-weight="bold" fill="#6A1B9A">VDC (3×3) 反对角线差分</text>
  <!-- 3x3 grid with anti-diagonal -->
  <g transform="translate(640,452)">
    <rect x="0" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="0" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="0" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="39" y="10" text-anchor="middle" font-size="6" fill="#fff">1</text>
    <rect x="0" y="16" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="16" y="16" width="14" height="14" rx="1" fill="#7B1FA2" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="23" y="28" text-anchor="middle" font-size="6" fill="#fff">-2</text>
    <rect x="32" y="16" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="0" y="32" width="14" height="14" rx="1" fill="#CE93D8" stroke="#8E24AA" stroke-width="0.5"/>
    <text x="7" y="42" text-anchor="middle" font-size="6" fill="#fff">1</text>
    <rect x="16" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
    <rect x="32" y="32" width="14" height="14" rx="1" fill="#F3E5F5" stroke="#8E24AA" stroke-width="0.5"/>
  </g>
  <text x="700" y="480" font-size="9" fill="#666">→ 反对角线边缘 ╱</text>

  <!-- Concat + Conv1x1 output -->
  <rect x="640" y="510" width="180" height="30" rx="6" fill="#E1BEE7" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="730" y="529" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A1B9A">Concat → Conv 1×1</text>

  <!-- Arrows from each kernel to Concat -->
  <line x1="740" y1="183" x2="740" y2="190" stroke="#8E24AA" stroke-width="0" marker-end="url(#arrowP)"/>
  <path d="M 730 500 L 730 510" fill="none" stroke="#8E24AA" stroke-width="1.2" marker-end="url(#arrowP)"/>

  <!-- Output label -->
  <text x="730" y="555" text-anchor="middle" font-size="9" fill="#6A1B9A">→ 梯度特征输出</text>

  <!-- Connector line from main MDPConv box to detail -->
  <path d="M 565 257 L 590 257 L 590 300 L 618 300" fill="none" stroke="#8E24AA" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowP)"/>
  <text x="580" y="248" font-size="8" fill="#8E24AA">详解 →</text>

  <!-- Bottom formula outside border -->
  <text x="305" y="570" text-anchor="middle" font-size="10" fill="#555" font-style="italic">y = x + FFN(LN(x)) + RFM(x) + α · MDPConv(x)</text>

  <!-- Defs -->
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9E9E9E"/>
    </marker>
    <marker id="arrowP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8E24AA"/>
    </marker>
  </defs>
</svg>
</body>
</html>
