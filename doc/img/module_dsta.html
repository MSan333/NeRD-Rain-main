<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>★DSTA - Density-driven Selective Token Aggregation</title>
<style>
body { margin: 0; padding: 20px; background: #fff; font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">
    ★ DSTA: Density-driven Selective Token Aggregation
  </text>
  <rect x="15" y="8" width="770" height="28" rx="4" fill="none" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- ===== Step 1: Token 密度评估 ===== -->
  <rect x="30" y="50" width="740" height="120" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="55" y="72" font-size="12" font-weight="bold" fill="#333">Step 1: Token 密度评估</text>
  <text x="720" y="72" text-anchor="end" font-size="10" fill="#888">Density MLP</text>

  <!-- 16个tokens热力图 -->
  <text x="55" y="92" font-size="10" fill="#666">N = 256 tokens（示意16格）</text>
  <!-- 高密度到低密度渐变 -->
  <rect x="55" y="100" width="40" height="28" rx="3" fill="#D32F2F"/>
  <rect x="100" y="100" width="40" height="28" rx="3" fill="#E53935"/>
  <rect x="145" y="100" width="40" height="28" rx="3" fill="#EF5350"/>
  <rect x="190" y="100" width="40" height="28" rx="3" fill="#F44336"/>
  <rect x="235" y="100" width="40" height="28" rx="3" fill="#E57373"/>
  <rect x="280" y="100" width="40" height="28" rx="3" fill="#EF9A9A"/>
  <rect x="325" y="100" width="40" height="28" rx="3" fill="#FFCDD2"/>
  <rect x="370" y="100" width="40" height="28" rx="3" fill="#D32F2F"/>
  <rect x="415" y="100" width="40" height="28" rx="3" fill="#FFCDD2"/>
  <rect x="460" y="100" width="40" height="28" rx="3" fill="#EF9A9A"/>
  <rect x="505" y="100" width="40" height="28" rx="3" fill="#E53935"/>
  <rect x="550" y="100" width="40" height="28" rx="3" fill="#FFCDD2"/>
  <rect x="595" y="100" width="40" height="28" rx="3" fill="#F44336"/>
  <rect x="640" y="100" width="40" height="28" rx="3" fill="#EF9A9A"/>
  <rect x="685" y="100" width="40" height="28" rx="3" fill="#E57373"/>
  <rect x="730" y="100" width="40" height="28" rx="3" fill="#FFCDD2"/>

  <!-- 密度分数标注 -->
  <text x="55" y="148" font-size="9" fill="#C62828">■ 高密度</text>
  <text x="55" y="160" font-size="9" fill="#EF9A9A">■ 中密度</text>
  <text x="55" y="160" font-size="9" fill="#EF9A9A" dx="80">■</text>
  <text x="150" y="148" font-size="9" fill="#FFCDD2">■ 低密度</text>
  <rect x="500" y="138" width="120" height="22" rx="4" fill="#FFF3E0" stroke="#FF5722" stroke-dasharray="4,2" stroke-width="1"/>
  <text x="510" y="153" font-size="9" fill="#E65100">★ 创新: Density MLP</text>

  <!-- 箭头到 Step2 -->
  <line x1="400" y1="170" x2="400" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ===== Step 2: Top-K 选择 ===== -->
  <rect x="30" y="188" width="740" height="130" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="55" y="210" font-size="12" font-weight="bold" fill="#333">Step 2: Top-K 选择</text>
  <text x="720" y="210" text-anchor="end" font-size="10" fill="#888">keep_ratio = 0.5</text>

  <!-- 高密度保留 -->
  <text x="55" y="232" font-size="10" fill="#C62828" font-weight="bold">★ 高密度 tokens → 保留原始KV (128个)</text>
  <rect x="55" y="238" width="28" height="22" rx="3" fill="#D32F2F"/>
  <rect x="87" y="238" width="28" height="22" rx="3" fill="#E53935"/>
  <rect x="119" y="238" width="28" height="22" rx="3" fill="#EF5350"/>
  <rect x="151" y="238" width="28" height="22" rx="3" fill="#F44336"/>
  <rect x="183" y="238" width="28" height="22" rx="3" fill="#D32F2F"/>
  <rect x="215" y="238" width="28" height="22" rx="3" fill="#E53935"/>
  <rect x="247" y="238" width="28" height="22" rx="3" fill="#F44336"/>
  <rect x="279" y="238" width="28" height="22" rx="3" fill="#E57373"/>
  <text x="320" y="254" font-size="10" fill="#666">... ×128</text>
  <!-- 星标 -->
  <text x="65" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="97" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="129" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="161" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="193" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="225" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="257" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>
  <text x="289" y="253" font-size="8" fill="#FFF" text-anchor="middle">★</text>

  <!-- 低密度待聚合 -->
  <text x="55" y="282" font-size="10" fill="#999" font-weight="bold">□ 低密度 tokens → 待聚合 (128个)</text>
  <rect x="55" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <rect x="87" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <rect x="119" y="288" width="28" height="22" rx="3" fill="#EF9A9A"/>
  <rect x="151" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <rect x="183" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <rect x="215" y="288" width="28" height="22" rx="3" fill="#EF9A9A"/>
  <rect x="247" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <rect x="279" y="288" width="28" height="22" rx="3" fill="#FFCDD2"/>
  <text x="320" y="304" font-size="10" fill="#666">... ×128</text>
  <!-- 方框标 -->
  <text x="65" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="97" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="129" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="161" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="193" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="225" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="257" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>
  <text x="289" y="303" font-size="8" fill="#999" text-anchor="middle">□</text>

  <!-- 箭头到 Step3 -->
  <line x1="400" y1="318" x2="400" y2="338" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ===== Step 3: 空间分组聚合 ===== -->
  <rect x="30" y="340" width="740" height="140" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="55" y="362" font-size="12" font-weight="bold" fill="#333">Step 3: 空间分组聚合</text>
  <text x="720" y="362" text-anchor="end" font-size="10" fill="#888">group_size = 4</text>

  <!-- 上排：保留tokens -->
  <text x="55" y="382" font-size="10" fill="#C62828">保留 tokens（128个，原样）:</text>
  <rect x="55" y="388" width="20" height="18" rx="2" fill="#D32F2F"/>
  <rect x="78" y="388" width="20" height="18" rx="2" fill="#E53935"/>
  <rect x="101" y="388" width="20" height="18" rx="2" fill="#EF5350"/>
  <rect x="124" y="388" width="20" height="18" rx="2" fill="#F44336"/>
  <rect x="147" y="388" width="20" height="18" rx="2" fill="#D32F2F"/>
  <rect x="170" y="388" width="20" height="18" rx="2" fill="#E53935"/>
  <rect x="193" y="388" width="20" height="18" rx="2" fill="#F44336"/>
  <rect x="216" y="388" width="20" height="18" rx="2" fill="#E57373"/>
  <text x="245" y="402" font-size="9" fill="#666">... ×128</text>

  <!-- 下排：聚合后的代表tokens -->
  <text x="55" y="425" font-size="10" fill="#FF8F00">聚合 tokens（128/4 = 32个代表）:</text>

  <!-- 分组示意：4个小方块 → 1个大方块 -->
  <rect x="55" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="68" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="81" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="94" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <!-- 括号 -->
  <text x="113" y="443" font-size="14" fill="#666">→</text>
  <!-- 大方块 -->
  <rect x="130" y="429" width="30" height="20" rx="3" fill="#FF8F00" opacity="0.8"/>
  <text x="145" y="443" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">Agg</text>

  <rect x="170" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="183" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="196" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <rect x="209" y="432" width="12" height="12" rx="1" fill="#FFCDD2" stroke="#EF9A9A" stroke-width="0.5"/>
  <text x="228" y="443" font-size="14" fill="#666">→</text>
  <rect x="245" y="429" width="30" height="20" rx="3" fill="#FF8F00" opacity="0.8"/>
  <text x="260" y="443" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">Agg</text>

  <text x="290" y="443" font-size="9" fill="#666">... ×32</text>

  <!-- 汇合标注 -->
  <rect x="420" y="430" width="300" height="35" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="570" y="445" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">总计: M = 128 + 32 = 160 tokens</text>
  <text x="570" y="460" text-anchor="middle" font-size="9" fill="#666">（保留 + 聚合代表）</text>

  <!-- 箭头到 Step4 -->
  <line x1="400" y1="480" x2="400" y2="498" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ===== Step 4: 压缩注意力计算 ===== -->
  <rect x="30" y="500" width="740" height="185" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="55" y="522" font-size="12" font-weight="bold" fill="#333">Step 4: 压缩注意力计算</text>

  <!-- Q 矩阵 -->
  <rect x="70" y="535" width="50" height="90" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="95" y="585" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">Q</text>
  <text x="95" y="640" text-anchor="middle" font-size="9" fill="#666">N=256</text>

  <!-- × 符号 -->
  <circle cx="150" cy="580" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="150" y="584" text-anchor="middle" font-size="12" fill="#333">×</text>

  <!-- K^T 矩阵 -->
  <rect x="180" y="550" width="90" height="50" rx="4" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="225" y="579" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">K^T</text>
  <text x="225" y="640" text-anchor="middle" font-size="9" fill="#666">M=160</text>

  <!-- = 符号 -->
  <text x="290" y="584" text-anchor="middle" font-size="16" fill="#333">=</text>

  <!-- Attention 矩阵 -->
  <rect x="310" y="535" width="100" height="90" rx="4" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="360" y="585" text-anchor="middle" font-size="11" fill="#E65100" font-weight="bold">Attention</text>
  <text x="360" y="640" text-anchor="middle" font-size="9" fill="#666">256×160</text>

  <!-- 对比数据 -->
  <rect x="450" y="535" width="290" height="90" rx="8" fill="#FFF" stroke="#FF5722" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="465" y="553" font-size="9" fill="#E65100">★ 计算复杂度对比</text>
  <text x="465" y="573" font-size="11" fill="#666">原始: N×N = 256×256 =</text>
  <text x="680" y="573" font-size="11" fill="#C62828" font-weight="bold">65,536</text>
  <text x="465" y="593" font-size="11" fill="#666">压缩: N×M = 256×160 =</text>
  <text x="680" y="593" font-size="11" fill="#2E7D32" font-weight="bold">40,960</text>
  <line x1="465" y1="600" x2="725" y2="600" stroke="#EEE" stroke-width="1"/>
  <text x="465" y="617" font-size="12" fill="#FF5722" font-weight="bold">节省: ↓37.5% 计算量</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
</body>
</html>
